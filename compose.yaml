name: ${COMPOSE_PROJECT_NAME:-hooviepack}

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-/api}
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/hooviepack
      CSP_OIDC_ORIGIN: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      CSP_S3_ORIGIN: ${CSP_S3_ORIGIN:?Copy .env.example to .env and set CSP_S3_ORIGIN to the exact S3 bucket origin}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-hooviepack-web}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - hooviepack

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hooviepack};Username=${POSTGRES_USER:-hooviepack};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      Authentication__Authority: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/hooviepack
      Authentication__MetadataAddress: ${KEYCLOAK_METADATA_URL:-http://keycloak:8080/realms/hooviepack/.well-known/openid-configuration}
      Authentication__ValidIssuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/hooviepack
      Authentication__Audience: ${API_AUDIENCE:-hooviepack-api}
      Authentication__RequireHttpsMetadata: ${AUTH_REQUIRE_HTTPS_METADATA:-false}
      FileService__BaseUrl: http://files-api:8080
      FileService__ApiKey: ${FILES_INTERNAL_API_KEY:?Copy .env.example to .env and set FILES_INTERNAL_API_KEY}
      FileService__TimeoutSeconds: ${FILES_API_TIMEOUT_SECONDS:-10}
      MediaStorage__MaxImageBytes: ${S3_MAX_FILE_BYTES:-10485760}
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS:-true}
      Cors__AllowedOrigins__0: ${APP_ORIGIN:-http://localhost:4200}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      files-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    restart: unless-stopped
    networks:
      - hooviepack

  files-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.files
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hooviepack};Username=${POSTGRES_USER:-hooviepack};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      Database__ApplyMigrations: ${FILES_DATABASE_APPLY_MIGRATIONS:-true}
      InternalApi__ApiKey: ${FILES_INTERNAL_API_KEY:?Copy .env.example to .env and set FILES_INTERNAL_API_KEY}
      FileStorage__BucketName: ${S3_BUCKET_NAME:?Copy .env.example to .env and set S3_BUCKET_NAME}
      FileStorage__Region: ${AWS_REGION:-us-east-1}
      FileStorage__KeyPrefix: ${S3_KEY_PREFIX:-files}
      FileStorage__UploadUrlLifetimeMinutes: ${S3_UPLOAD_URL_TTL_MINUTES:-5}
      FileStorage__DownloadUrlLifetimeMinutes: ${S3_DOWNLOAD_URL_TTL_MINUTES:-5}
      FileStorage__MaxFileBytes: ${S3_MAX_FILE_BYTES:-10485760}
      FileStorage__ServiceUrl: ${S3_SERVICE_URL:-}
      FileStorage__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${FILES_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${FILES_AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${FILES_AWS_SESSION_TOKEN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FILES_API_PORT:-5001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    restart: unless-stopped
    networks:
      - hooviepack

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hooviepack}
      POSTGRES_USER: ${POSTGRES_USER:-hooviepack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - hooviepack

  keycloak-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - hooviepack

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.2}
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4200}
      LOCAL_APP_ORIGIN: http://localhost:4200
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:?Copy .env.example to .env and set DEMO_OWNER_PASSWORD}
      DEMO_MEMBER_PASSWORD: ${DEMO_MEMBER_PASSWORD:?Copy .env.example to .env and set DEMO_MEMBER_PASSWORD}
    volumes:
      - ./infra/keycloak/hooviepack-realm.json:/opt/keycloak/data/import/hooviepack-realm.json:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks:
      - hooviepack

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    profiles: ["production"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${LETSENCRYPT_DIR:-./infra/nginx/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_CHALLENGE_DIR:-./infra/nginx/acme}:/var/www/certbot:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - hooviepack

volumes:
  postgres_data:
  keycloak_data:
  media_data:

networks:
  hooviepack:
    driver: bridge

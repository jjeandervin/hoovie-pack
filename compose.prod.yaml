# compose.prod.yaml

services:
  web:
    ports: !reset []
    networks:
      jeandervin:
        aliases:
          - hooviepack-web

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Keep HTTPS required for arbitrary metadata endpoints. The API has a
      # narrow exception for the trusted Docker-internal keycloak hostname.
      Authentication__RequireHttpsMetadata: "true"
      # Production schema changes are run explicitly by db-migrations.
      Database__ApplyMigrations: "false"
    ports: !reset []
    networks:
      jeandervin:
        aliases:
          - hooviepack-api

  files-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Production schema changes are run explicitly by files-db-migrations.
      Database__ApplyMigrations: "false"
    ports: !reset []

  db-migrations:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.migrations
    profiles: ["migration"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hooviepack};Username=${POSTGRES_USER:-hooviepack};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"
    networks:
      - hooviepack

  files-db-migrations:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.files.migrations
    profiles: ["migration"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hooviepack};Username=${POSTGRES_USER:-hooviepack};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"
    networks:
      - hooviepack

  legacy-media-migration:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.file-migration
    profiles: ["media-migration"]
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hooviepack};Username=${POSTGRES_USER:-hooviepack};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      LegacyMedia__RootPath: /legacy-media
      FileStorage__BucketName: ${S3_BUCKET_NAME:?Copy .env.example to .env and set S3_BUCKET_NAME}
      FileStorage__Region: ${AWS_REGION:-us-east-1}
      FileStorage__KeyPrefix: ${S3_KEY_PREFIX:-files}
      FileStorage__UploadUrlLifetimeMinutes: ${S3_UPLOAD_URL_TTL_MINUTES:-5}
      FileStorage__DownloadUrlLifetimeMinutes: ${S3_DOWNLOAD_URL_TTL_MINUTES:-5}
      FileStorage__MaxFileBytes: ${S3_MAX_FILE_BYTES:-10485760}
      FileStorage__ServiceUrl: ${S3_SERVICE_URL:-}
      FileStorage__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${FILES_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${FILES_AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${FILES_AWS_SESSION_TOKEN:-}
    volumes:
      - media_data:/legacy-media:ro
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"
    networks:
      - hooviepack

  postgres:
    ports: !reset []

  keycloak:
    ports: !reset []
    networks:
      jeandervin:
        aliases:
          - hooviepack-keycloak

networks:
  jeandervin:
    external: true

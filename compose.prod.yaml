# compose.prod.yaml

services:
  web:
    ports: !reset []
    networks:
      jeandervin:
        aliases:
          - hooviepack-web

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Keep HTTPS required for arbitrary metadata endpoints. The API has a
      # narrow exception for the trusted Docker-internal keycloak hostname.
      Authentication__RequireHttpsMetadata: "true"
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS:-false}
    ports: !reset []
    networks:
      jeandervin:
        aliases:
          - hooviepack-api

  postgres:
    ports: !reset []

  keycloak:
    ports: !reset []
    networks:
      jeandervin:
        aliases:
          - hooviepack-keycloak

networks:
  jeandervin:
    external: true

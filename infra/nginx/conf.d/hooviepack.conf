upstream hooviepack_web {
    server web:80;
    keepalive 16;
}

upstream hooviepack_api {
    server api:8080;
    keepalive 32;
}

upstream hooviepack_keycloak {
    server keycloak:8080;
    keepalive 16;
}

# Keep this endpoint available over HTTP for the container healthcheck. All
# other traffic is redirected to HTTPS. ACME webroot challenges are exempt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hooviestar.com auth.hooviestar.com;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooviestar.com;

    ssl_certificate /etc/letsencrypt/live/hooviestar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooviestar.com/privkey.pem;
    ssl_session_cache shared:HooviePackTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://hooviepack_api;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /api/ {
        # No trailing slash on proxy_pass: the API expects the /api prefix.
        proxy_pass http://hooviepack_api;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        proxy_pass http://hooviepack_web;
        proxy_http_version 1.1;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.hooviestar.com;

    # The certificate requested in README.md includes both DNS names.
    ssl_certificate /etc/letsencrypt/live/hooviestar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooviestar.com/privkey.pem;
    ssl_session_cache shared:HooviePackTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep the OIDC realm, discovery, authorization, token, JWKS, logout, and
    # login routes public below. Only Keycloak administration is restricted.
    # Add the exact LAN/VPN administrator CIDRs used by your deployment.
    location ^~ /admin/ {
        allow 127.0.0.1;
        allow ::1;
        # allow 192.0.2.0/24;
        deny all;

        proxy_pass http://hooviepack_keycloak;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        proxy_pass http://hooviepack_keycloak;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
